name: local-leaks

# Scan tracked files for maintainer/machine identifying info that must not be public
# (home paths, usernames, hostnames, private repo names, session ids). Created by
# agent-workflows. This class of leak is NOT caught by ordinary secret scanners.
#
# Installs agent-workflows from GitHub @main because the current PyPI release (1.2.0)
# predates the `check-local-leaks` command. Switch back to a pinned PyPI release once
# `agent-workflows > 1.2.0` is published, or replace the install line with a vendored
# wheel in air-gapped environments.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  local-leaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent-workflows
        run: pip install "git+https://github.com/fariello/agent-workflows.git@main"

      - name: Scan tracked files for local leaks
        run: python -m agent_workflows check-local-leaks .
