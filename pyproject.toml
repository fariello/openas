[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openas"
version = "0.1.0"
description = "Line-by-line and chunked streaming I/O for plain and compressed files (.gz, .bz2, .xz, .zst) in text or binary mode across local paths, HTTP/HTTPS, FTP, and SSH/SFTP."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Gabriele Fariello" }
]
keywords = [
  "streaming",
  "compression",
  "gzip",
  "bzip2",
  "lzma",
  "zstd",
  "sftp",
  "ftp",
  "http",
  "io",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Archiving :: Compression",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = [
  "paramiko>=2.1",
  "zstandard>=0.14.0",
  "requests>=2.20",
  "tqdm>=4.0",
  "ftputil>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
openas = "openas.openas:_cli_main"

[project.urls]
Homepage = "https://github.com/fariello/openas"
Repository = "https://github.com/fariello/openas"
Issues = "https://github.com/fariello/openas/issues"
Documentation = "https://github.com/fariello/openas/blob/main/docs/API.md"
Changelog = "https://github.com/fariello/openas/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "error::ResourceWarning",
]
