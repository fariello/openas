[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyopen"
version = "0.1.0"
description = "A Python module for versatile file handling (compression formats and basic remote sources)."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Gabriele Fariello" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "paramiko",
    "zstandard",
    "requests",
    "tqdm",
    "ftputil"
]

[project.urls]
Homepage = "https://github.com/fariello/polyopen"
